<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c2c">
<title>骰子鍛造坊</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1c2c; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #1a1c2c; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #f4f4f4; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; background: #1a1c2c; z-index: 5; }
  #loading h1 { margin: 0; font-size: 28px; color: #ffcd75; letter-spacing: 2px; }
  #bar { width: min(70vw, 320px); height: 12px; border: 2px solid #ffcd75; padding: 2px; }
  #fill { height: 100%; width: 0%; background: #ef7d57; transition: width .15s; }
  #msg { font-size: 14px; color: #94b0c2; }
  #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #1a1c2c; color: #f4f4f4; font: 18px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; z-index: 10; text-align: center; }
  #rotate .phone { width: 46px; height: 78px; border: 4px solid #ffcd75; border-radius: 8px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  #fs { position: fixed; right: 4px; top: 50%; transform: translateY(-50%); z-index: 11; display: none; padding: 6px 4px; width: 34px; line-height: 1.2; font: 12px sans-serif;
    color: #1a1c2c; background: #ffcd75; border: none; border-radius: 6px; opacity: .85; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><h1>骰子鍛造坊</h1><div id="bar"><div id="fill"></div></div><div id="msg">載入中…</div></div>
<div id="rotate"><div class="phone"></div><div>請把手機橫放來遊玩</div><div id="fshint" style="font-size:14px;color:#94b0c2;display:none">建議點右側「全螢幕」</div></div>
<button id="fs">全螢幕</button>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  var config = {
    dataUrl: "Build/BuildWeb.data.unityweb",
    frameworkUrl: "Build/BuildWeb.framework.js.unityweb",
    codeUrl: "Build/BuildWeb.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "DiceForge",
    productVersion: "1.0",
    // cap the render resolution on phones (very high-DPI screens cost battery for no visible gain on pixel art)
    devicePixelRatio: isMobile ? Math.min(window.devicePixelRatio || 1, 2) : (window.devicePixelRatio || 1),
  };
  var fsBtn = document.querySelector("#fs");
  function goFull() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      Promise.resolve(req.call(el)).then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }).catch(function () {});
    }
  }
  var canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if (isMobile && canFull) { fsBtn.style.display = "block"; document.querySelector("#fshint").style.display = "block"; }
  fsBtn.addEventListener("click", function (e) { e.stopPropagation(); goFull(); });
  document.addEventListener("fullscreenchange", function () { fsBtn.style.display = document.fullscreenElement ? "none" : (isMobile && canFull ? "block" : "none"); });
  // stop pull-to-refresh / page scroll from stealing drags (double-tap zoom is off via touch-action + viewport)
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  var script = document.createElement("script");
  script.src = "Build/BuildWeb.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#fill").style.width = (100 * p) + "%";
    }).then(function () {
      document.querySelector("#loading").style.display = "none";
    }).catch(function (message) {
      document.querySelector("#msg").textContent = "載入失敗：" + message;
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
